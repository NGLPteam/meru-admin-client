name: continuous-integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-js:
    runs-on: ubuntu-latest
    name: Lint Javascript

    steps:
      - name: "Check out code"
        uses: actions/checkout@v4

      - name: "Install tools and Node dependencies"
        uses: ./.github/actions/setup

      - name: "Lint Client"
        run: |
          yarn lint
        working-directory: ./

  build:
    runs-on: ubuntu-latest
    name: "Ensure build completes"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - env:
          NODE_ENV: development
        run: yarn build:ci
