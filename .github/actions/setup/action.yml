name: Setup
description: Install Node and Yarn via mise, then install node packages

runs:
  using: composite
  steps:
    - name: "Install tools via mise"
      uses: jdx/mise-action@v5

    - name: "Restore Yarn cache"
      uses: actions/cache@v5
      with:
        path: ~/.yarn/berry/cache
        key: ${{ runner.os }}-yarn-cache-${{ hashFiles('mise.toml') }}-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-cache-${{ hashFiles('mise.toml') }}-

    - name: "Install node packages"
      shell: bash
      env:
        NODE_ENV: development
      run: yarn install
